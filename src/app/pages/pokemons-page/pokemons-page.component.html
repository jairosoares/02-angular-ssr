<h1 class="text-3xl">Lista de Pokemons</h1>
<h2 class="text-xl">Página atual: {{currentPage()}}</h2>

<hr class="my-2" />

@if (pokemons().length !=0 ) {
  <pokemon-list [pokemons]="pokemons()"/>
} @else {
  <pokemon-list-skeleton/>
}

<div class="flex justify-between">

  <button (click)="loadPokemons(-1)" class="mt-2">
    Anterior
  </button>

  <button (click)="loadPokemons(+1)" class="mt-2">
    Próximo
  </button>

</div>
